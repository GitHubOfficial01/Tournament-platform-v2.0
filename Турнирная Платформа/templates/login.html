{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1><i class="fas fa-sign-in-alt"></i> Вход для жюри и организаторов</h1>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Имя пользователя:</label>
                <input type="text" id="username" name="username" required
                       placeholder="Введите ваше имя пользователя">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Пароль:</label>
                <input type="password" id="password" name="password" required
                       placeholder="Введите ваш пароль">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
        </form>

        <div class="auth-links">
            <p>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
            <p><a href="{{ url_for('index') }}">Вернуться на главную</a></p>
        </div>
    </div>
</div>
{% endblock %}
