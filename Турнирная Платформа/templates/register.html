{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1><i class="fas fa-user-plus"></i> Регистрация для жюри и организаторов</h1>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Имя пользователя:</label>
                <input type="text" id="username" name="username" required
                       placeholder="Придумайте имя пользователя">
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email:</label>
                <input type="email" id="email" name="email" required
                       placeholder="Введите ваш email">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Пароль:</label>
                <input type="password" id="password" name="password" required
                       placeholder="Придумайте пароль">
            </div>

            <div class="form-group">
                <label for="role"><i class="fas fa-user-tag"></i> Роль:</label>
                <select id="role" name="role" required>
                    <option value="">Выберите роль</option>
                    <option value="jury">Жюри</option>
                    <option value="organizer">Организатор</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-user-plus"></i> Зарегистрироваться
            </button>
        </form>

        <div class="auth-links">
            <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
            <p><a href="{{ url_for('index') }}">Вернуться на главную</a></p>
        </div>
    </div>
</div>
{% endblock %}
